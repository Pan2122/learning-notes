<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Sigma-Delta 噪声整形与数字低通</title>
  <desc id="desc">普通量化噪声较均匀分布，Sigma-Delta 将更多噪声推到高频，数字低通保留低频信号。</desc>
  <rect width="1200" height="560" fill="#ffffff"/>
  <text x="600" y="42" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="28" font-weight="700" fill="#17324d">Sigma-Delta：把量化噪声推到带外</text>
  <g font-family="Arial,'Microsoft YaHei',sans-serif">
    <text x="270" y="95" text-anchor="middle" font-size="21" fill="#17324d">普通量化噪声</text>
    <text x="870" y="95" text-anchor="middle" font-size="21" fill="#17324d">Noise Shaping 后</text>
    <text x="70" y="190" font-size="16" fill="#64748b">Noise</text><text x="670" y="190" font-size="16" fill="#64748b">Noise</text>
    <text x="270" y="395" text-anchor="middle" font-size="16" fill="#64748b">频率</text><text x="870" y="395" text-anchor="middle" font-size="16" fill="#64748b">频率</text>
  </g>
  <line x1="100" y1="350" x2="520" y2="350" stroke="#94a3b8" stroke-width="2"/><line x1="100" y1="140" x2="100" y2="350" stroke="#94a3b8" stroke-width="2"/>
  <line x1="700" y1="350" x2="1120" y2="350" stroke="#94a3b8" stroke-width="2"/><line x1="700" y1="140" x2="700" y2="350" stroke="#94a3b8" stroke-width="2"/>
  <path d="M105 240 H515" fill="none" stroke="#b87513" stroke-width="20" opacity="0.8"/>
  <path d="M705 335 C760 333 790 325 820 315 C860 300 875 270 900 235 C925 195 950 175 980 150 C1030 115 1080 90 1115 75" fill="none" stroke="#7d4ba1" stroke-width="8"/>
  <rect x="705" y="260" width="150" height="70" rx="10" fill="#eaf6f1" stroke="#25866d" stroke-width="2"/>
  <text x="780" y="291" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" fill="#17745d">有用低频</text>
  <text x="780" y="316" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" fill="#64748b">保留</text>
  <rect x="930" y="115" width="180" height="70" rx="10" fill="#f2eafd" stroke="#7d4ba1" stroke-width="2"/>
  <text x="1020" y="146" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" fill="#684087">带外量化噪声</text>
  <text x="1020" y="171" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" fill="#64748b">数字 LPF 去除</text>
  <line x1="700" y1="350" x2="1120" y2="350" stroke="#94a3b8" stroke-width="2"/>
  <text x="600" y="465" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="20" fill="#17324d">Oversampling + Noise Shaping + Digital Low-Pass + Decimation</text>
  <text x="600" y="505" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" fill="#475569">噪声没有消失，而是被搬到更容易滤除的频段</text>
</svg>
