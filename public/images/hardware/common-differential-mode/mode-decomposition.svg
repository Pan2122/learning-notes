<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">共模与差模电压分解</title>
  <desc id="desc">两根线的电压可以拆成共同的共模中心和相反方向的差模分量。</desc>
  <defs>
    <marker id="blue-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#1769aa"/></marker>
    <marker id="gold-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#b87513"/></marker>
  </defs>
  <rect width="1200" height="620" fill="#ffffff"/>
  <text x="600" y="40" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="26" font-weight="700" fill="#17324d">任意两根线：共模中心 + 对称的差模摆幅</text>
  <text x="600" y="78" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" fill="#64748b">V+ = VCM + VDM/2，V- = VCM - VDM/2</text>
  <line x1="600" y1="125" x2="600" y2="470" stroke="#94a3b8" stroke-width="3"/>
  <line x1="270" y1="300" x2="930" y2="300" stroke="#94a3b8" stroke-width="3"/>
  <text x="600" y="526" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" fill="#475569">以参考地为零点时，VCM 决定整体位置，VDM 决定两根线之间的有效信号</text>
  <circle cx="600" cy="300" r="8" fill="#b87513"/>
  <text x="620" y="292" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" fill="#b87513">VCM</text>
  <circle cx="600" cy="180" r="8" fill="#1769aa"/>
  <circle cx="600" cy="420" r="8" fill="#1769aa"/>
  <line x1="600" y1="300" x2="600" y2="180" stroke="#1769aa" stroke-width="4" marker-end="url(#blue-arrow)"/>
  <line x1="600" y1="300" x2="600" y2="420" stroke="#1769aa" stroke-width="4" marker-end="url(#blue-arrow)"/>
  <text x="630" y="235" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" fill="#1769aa">+VDM/2</text>
  <text x="630" y="380" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" fill="#1769aa">-VDM/2</text>
  <line x1="600" y1="180" x2="600" y2="420" stroke="#b87513" stroke-width="3" stroke-dasharray="8 8"/>
  <line x1="565" y1="180" x2="565" y2="420" stroke="#b87513" stroke-width="3" marker-start="url(#gold-arrow)" marker-end="url(#gold-arrow)"/>
  <text x="505" y="310" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" fill="#b87513">|VDM|</text>
  <text x="550" y="165" text-anchor="end" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="19" font-weight="700" fill="#17324d">V+</text>
  <text x="550" y="440" text-anchor="end" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="19" font-weight="700" fill="#17324d">V-</text>
  <text x="990" y="180" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" fill="#64748b">例：V+ = 2.6 V</text>
  <text x="990" y="215" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" fill="#64748b">V- = 2.4 V</text>
  <text x="990" y="265" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" fill="#64748b">VCM = 2.5 V</text>
  <text x="990" y="300" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" fill="#64748b">VDM = 0.2 V</text>
  <text x="990" y="350" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16" fill="#64748b">两根线一起抬高 1 V：</text>
  <text x="990" y="385" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" fill="#64748b">VDM 仍为 0.2 V</text>
</svg>
