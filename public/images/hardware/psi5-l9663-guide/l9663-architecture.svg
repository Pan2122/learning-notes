<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">L9663 Mode 1 和 Mode 2 架构</title>
  <desc id="desc">Mode 1 由 L9663 解码并缓冲，Mode 2 由 L9663 提供模拟前端，Manchester 解码交给外部 MCU。</desc>
  <rect width="1200" height="430" fill="#ffffff"/>
  <text x="600" y="38" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="24" font-weight="700" fill="#17324d">L9663 的职责边界：解码在哪里完成？</text>
  <rect x="55" y="90" width="510" height="255" rx="14" fill="#f5f9fc" stroke="#1b6fae" stroke-width="3"/>
  <rect x="635" y="90" width="510" height="255" rx="14" fill="#f5f9fc" stroke="#25866d" stroke-width="3"/>
  <text x="310" y="128" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#155e91">Mode 1：L9663 解码并缓冲</text>
  <text x="890" y="128" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#17745d">Mode 2：外部 MCU 解码</text>
  <rect x="90" y="175" width="130" height="90" rx="10" fill="#e7f2fa" stroke="#1b6fae" stroke-width="2"/>
  <rect x="300" y="155" width="190" height="130" rx="10" fill="#edf3f8" stroke="#17324d" stroke-width="2"/>
  <rect x="680" y="175" width="130" height="90" rx="10" fill="#e7f2fa" stroke="#1b6fae" stroke-width="2"/>
  <rect x="890" y="155" width="190" height="130" rx="10" fill="#eaf6f1" stroke="#25866d" stroke-width="2"/>
  <g font-family="Arial,'Microsoft YaHei',sans-serif" text-anchor="middle" fill="#17324d"><text x="155" y="215" font-size="18">MCU</text><text x="155" y="240" font-size="14">SPI 读缓冲</text><text x="395" y="200" font-size="20">L9663</text><text x="395" y="228" font-size="14">电流接收</text><text x="395" y="253" font-size="14">Manchester / 时隙</text><text x="745" y="215" font-size="18">MCU</text><text x="745" y="240" font-size="14">DOUT / SYNC</text><text x="985" y="200" font-size="20">L9663</text><text x="985" y="228" font-size="14">模拟前端</text><text x="985" y="253" font-size="14">电流接收</text></g>
  <line x1="220" y1="220" x2="300" y2="220" stroke="#155e91" stroke-width="4"/>
  <line x1="490" y1="220" x2="550" y2="220" stroke="#b87513" stroke-width="7"/>
  <line x1="810" y1="220" x2="890" y2="220" stroke="#155e91" stroke-width="4"/>
  <line x1="1080" y1="220" x2="1140" y2="220" stroke="#b87513" stroke-width="7"/>
  <text x="310" y="320" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" fill="#526b82">普通 MCU：降低软件实时性压力</text>
  <text x="890" y="320" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" fill="#526b82">MCU 已有 PSI5 外设时可考虑</text>
</svg>
