<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">PSI5 典型系统架构</title>
  <desc id="desc">MCU 通过 PSI5 主收发器连接一组由两线供电并通信的远端传感器。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#155e91"/></marker>
    <marker id="arrow-gold" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#b87513"/></marker>
  </defs>
  <rect width="1200" height="430" fill="#ffffff"/>
  <text x="600" y="38" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="24" font-weight="700" fill="#17324d">PSI5 的核心：一对线同时完成供电与双向通信</text>
  <text x="355" y="76" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16" fill="#64748b">ECU 内部</text>
  <text x="890" y="76" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16" fill="#64748b">远端传感器侧</text>
  <rect x="80" y="125" width="230" height="145" rx="14" fill="#e7f2fa" stroke="#1b6fae" stroke-width="3"/>
  <text x="195" y="178" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="25" fill="#17324d">MCU</text>
  <text x="195" y="218" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" fill="#526b82">SPI / SYNC / IRQ</text>
  <rect x="410" y="105" width="310" height="185" rx="14" fill="#edf3f8" stroke="#17324d" stroke-width="3"/>
  <text x="565" y="160" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="25" fill="#17324d">PSI5 主收发器</text>
  <text x="565" y="205" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" fill="#526b82">供电 · 同步 · 电流解调</text>
  <text x="565" y="242" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" fill="#526b82">L9663 属于这一层</text>
  <line x1="310" y1="165" x2="410" y2="165" stroke="#155e91" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <line x1="410" y1="230" x2="310" y2="230" stroke="#155e91" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <text x="360" y="150" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" fill="#155e91">控制与读回</text>
  <line x1="720" y1="190" x2="795" y2="190" stroke="#b87513" stroke-width="10"/>
  <line x1="795" y1="190" x2="795" y2="145" stroke="#b87513" stroke-width="10"/>
  <line x1="795" y1="190" x2="795" y2="280" stroke="#b87513" stroke-width="10"/>
  <line x1="795" y1="145" x2="830" y2="145" stroke="#b87513" stroke-width="10" marker-end="url(#arrow-gold)"/>
  <line x1="795" y1="280" x2="830" y2="280" stroke="#b87513" stroke-width="10" marker-end="url(#arrow-gold)"/>
  <text x="758" y="172" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" fill="#b87513">两线</text>
  <rect x="830" y="105" width="270" height="80" rx="14" fill="#eaf6f1" stroke="#25866d" stroke-width="3"/>
  <rect x="830" y="240" width="270" height="80" rx="14" fill="#eaf6f1" stroke="#25866d" stroke-width="3"/>
  <text x="965" y="143" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="21" fill="#17745d">传感器 1</text>
  <text x="965" y="170" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" fill="#526b82">加速度 / 压力 / 位置</text>
  <text x="965" y="278" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="21" fill="#17745d">传感器 2 ... n</text>
  <text x="965" y="305" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" fill="#526b82">并联或菊花链</text>
  <line x1="120" y1="370" x2="1080" y2="370" stroke="#cbd5e1" stroke-width="2"/>
  <text x="600" y="405" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" fill="#475569">下行主要观察电压脉冲；上行主要观察取电电流的调制</text>
</svg>
